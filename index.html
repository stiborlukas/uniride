<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>uniride</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background-color: #f4f0e4; 
        }

        .fullscreen-image {
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            object-position: center; 
            display: block;
        }
    </style>
</head>
<body>

    <img 
        class="fullscreen-image" 
        src="identity.png" 
    />

</body>
</html>
